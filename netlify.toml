[build]
  publish = "."
  # Adds content hashes (?v=...) to local CSS/JS references so they can be cached for a year.
  command = "node scripts/fingerprint.mjs"

[functions]
  directory = "netlify/functions"

# Long-lived caching for files that never change in place
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# CSS and JS are referenced with a content hash (?v=...) added at build time by
# scripts/fingerprint.mjs, so a changed file always gets a new URL.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts never change in place: a new font file gets a new file name.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Owner pages: never cached, never indexed, no referrer
[[headers]]
  for = "/review-admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/review-admin"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# Basic security headers on every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
